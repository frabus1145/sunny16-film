<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sunny 16 Film</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunny 16 Film">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root {
    --bg: #0b0b0d; --panel: #17181b; --accent: #f2c14e; --accent2: #4ea1f2;
    --text: #eaeaea; --muted: #8b8d93; --danger: #f26b4e;
  }
  body.theme-light {
    --bg: #f3f2ee; --panel: #ffffff; --text: #17181b; --muted: #6b6d73;
    --accent: #b8790f; --accent2: #1f66a8; --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px; padding-top: calc(env(safe-area-inset-top, 20px) + 26px); padding-bottom: 40px;
  }
  .top-row { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; gap: 8px; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 4px 0 2px; color: var(--accent); text-align: center; flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel); border: 1px solid #24252a33;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem; cursor: pointer;
  }
  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; text-align: center; max-width: 420px; }
  .camera-chip {
    font-size: 0.7rem; color: var(--accent2); background: rgba(78,161,242,0.1);
    border: 1px solid rgba(78,161,242,0.3); border-radius: 8px; padding: 4px 10px;
    margin-bottom: 12px; text-align: center; cursor: pointer;
  }
  .tabs { display: flex; width: 100%; max-width: 420px; background: var(--panel); border-radius: 12px; padding: 4px; margin-bottom: 16px; border: 1px solid #24252a33; }
  .tab-btn { flex: 1; text-align: center; padding: 9px 1px; font-size: 0.68rem; font-weight: 600; color: var(--muted); border-radius: 9px; cursor: pointer; line-height: 1.2; }
  .tab-btn.active { background: rgba(242,193,78,0.14); color: var(--accent); }
  .view { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }
  .panel { width: 100%; max-width: 420px; background: var(--panel); border-radius: 14px; padding: 16px; border: 1px solid #24252a33; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  select, input[type=text], input[type=number] {
    background: var(--bg); color: var(--text); border: 1px solid #2f303680;
    border-radius: 8px; padding: 7px 10px; font-size: 0.9rem; flex: 1; margin-left: 12px;
  }
  input[type=text] { margin-left: 0; width: 100%; }
  .light-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .light-btn { background: var(--bg); border: 1px solid #2f303680; color: var(--text); padding: 8px 4px; border-radius: 10px; font-size: 0.7rem; text-align: center; cursor: pointer; line-height: 1.25; }
  .light-btn .emoji { font-size: 1.1rem; display: block; margin-bottom: 2px; }
  .light-btn.active { border-color: var(--accent); background: rgba(242,193,78,0.12); color: var(--accent); }
  .ev-fine { margin-top: 14px; }
  .ev-fine-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .table-wrap { width: 100%; max-width: 420px; background: var(--panel); border-radius: 14px; border: 1px solid #24252a33; overflow: hidden; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: var(--bg); color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 9px 6px; text-align: center; font-weight: 600; }
  td { padding: 9px 6px; text-align: center; border-top: 1px solid #24252a33; }
  tbody tr { cursor: pointer; }
  tr.selected td { background: rgba(78,161,242,0.16); color: var(--accent2); font-weight: 700; }
  tr.rec-main td { background: rgba(80,200,120,0.22); color: #4fd17a; font-weight: 800; }
  tr.rec-near1 td { background: rgba(80,200,120,0.12); }
  tr.rec-near2 td { background: rgba(80,200,120,0.06); }
  tr.selected.rec-main td, tr.selected.rec-near1 td, tr.selected.rec-near2 td { background: rgba(78,161,242,0.16); color: var(--accent2); }
  .aperture-col { color: var(--accent2); font-weight: 600; }
  .rec-badge { font-size: 0.6rem; background: rgba(80,200,120,0.25); color: #4fd17a; border-radius: 5px; padding: 1px 5px; margin-left: 5px; font-weight: 700; }
  .mark { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; margin-left: 5px; font-size: 0.72rem; cursor: pointer; vertical-align: middle; }
  .mark.mk-warn { background: rgba(242,107,78,0.16); }
  .mark.mk-info { background: rgba(78,161,242,0.16); }
  .mark.mk-shake { background: rgba(242,193,78,0.16); }
  .table-hint { text-align: center; font-size: 0.68rem; color: var(--muted); padding: 7px 10px; border-top: 1px solid #24252a33; }
  .reminder-badge { width: 100%; max-width: 420px; background: rgba(242,193,78,0.1); border: 1.5px solid rgba(242,193,78,0.45); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .reminder-badge .ricon { font-size: 1.1rem; flex-shrink: 0; }
  .reminder-badge .rtext { font-size: 0.76rem; color: var(--text); font-weight: 600; line-height: 1.4; }
  .save-btn { width: 100%; max-width: 420px; background: var(--accent); color: #1a1a1a; border: none; padding: 13px 0; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-bottom: 14px; }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled { opacity: 0.5; }
  .mini-alert { width: 100%; max-width: 420px; display: flex; align-items: center; gap: 8px; background: rgba(242,193,78,0.1); border: 1px solid rgba(242,193,78,0.35); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; cursor: pointer; font-size: 0.76rem; font-weight: 600; color: var(--text); }
  .warning { max-width: 420px; font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 4px; line-height: 1.4; padding: 0 8px; }

  .wheel-cluster { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 10px; }
  .wheel-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .wheel-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 8px; }
  .wheel-frame { position: relative; width: 100%; height: 170px; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px; overflow: hidden; }
  .wheel-highlight { position: absolute; left: 6px; right: 6px; top: 65px; height: 40px; background: rgba(242,193,78,0.12); border-top: 1px solid rgba(242,193,78,0.4); border-bottom: 1px solid rgba(242,193,78,0.4); border-radius: 8px; pointer-events: none; z-index: 2; }
  .wheel-fade-top, .wheel-fade-bottom { position: absolute; left: 0; right: 0; height: 45px; pointer-events: none; z-index: 3; }
  .wheel-fade-top { top: 0; background: linear-gradient(to bottom, var(--panel), transparent); }
  .wheel-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--panel), transparent); }
  .wheel-scroll { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .wheel-item { height: 40px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 0.88rem; color: var(--muted); font-family: ui-monospace, "SF Mono", monospace; }
  .wheel-item.center-active { color: var(--accent2); font-weight: 800; font-size: 1.05rem; }

  .viewfinder-box { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1/1; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 1px solid #24252a33; }
  .viewfinder-box video, .viewfinder-box img { width: 100%; height: 100%; object-fit: cover; }
  .cam-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
  .cam-placeholder .cam-emoji { font-size: 2rem; }
  .cam-activate-btn { background: var(--accent); color: #1a1a1a; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .viewfinder-controls { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .cam-shutter-btn { width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 4px solid rgba(255,255,255,0.4); cursor: pointer; }
  .cam-shutter-btn:active { background: #ddd; }
  .cam-retake-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }

  .dof-result { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px; padding: 18px; margin-bottom: 14px; text-align: center; }
  .dof-result .hyperfocal { font-size: 0.72rem; color: var(--muted); margin-bottom: 10px; }
  .dof-result .hyperfocal b { color: var(--accent); }
  .dof-range { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
  .dof-bound { text-align: center; }
  .dof-bound .num { font-size: 1.5rem; font-weight: 800; color: var(--accent2); font-family: ui-monospace, monospace; }
  .dof-bound .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .dof-arrow { color: var(--muted); font-size: 1.2rem; }
  .dof-sentence { font-size: 0.82rem; color: var(--text); line-height: 1.5; padding-top: 10px; border-top: 1px solid #24252a33; }
  .dof-sentence b { color: var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid #2a2b2f33; border-radius: 18px 18px 0 0; padding: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); max-height: 85vh; overflow-y: auto; }
  .modal-card h3 { margin: 0 0 12px; font-size: 1rem; color: var(--accent); }
  .modal-title-row { display: flex; justify-content: space-between; align-items: center; }
  .modal-title-row h3 { margin: 0; }
  .modal-x { width: 30px; height: 30px; border-radius: 50%; background: rgba(128,128,128,0.15); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; color: var(--muted); cursor: pointer; flex-shrink: 0; margin-bottom: 12px; }
  .modal-card .hint { font-size: 0.72rem; color: var(--muted); margin: -6px 0 14px; line-height: 1.4; }
  .string-preview { background: var(--bg); border: 1px solid #2f303680; border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, "SF Mono", monospace; font-size: 0.75rem; color: var(--accent2); margin-bottom: 14px; line-height: 1.5; word-break: break-word; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; margin-bottom: 5px; font-size: 0.78rem; }
  .roll-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .roll-choice-btn { background: var(--bg); border: 1px solid #2f303680; color: var(--text); padding: 9px 4px; border-radius: 9px; font-size: 0.78rem; text-align: center; cursor: pointer; }
  .roll-choice-btn.active { border-color: var(--accent); background: rgba(242,193,78,0.12); color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 11px 0; border-radius: 10px; text-align: center; font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-secondary { background: rgba(128,128,128,0.15); color: var(--text); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-row label { flex: 1; margin: 0; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--bg); border: 1px solid #2f303680; color: var(--muted); padding: 6px 11px; border-radius: 999px; font-size: 0.78rem; cursor: pointer; font-family: ui-monospace, monospace; }
  .chip.active { border-color: var(--accent); background: rgba(242,193,78,0.14); color: var(--accent); font-weight: 700; }
  .custom-add-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .custom-add-row input { margin-left: 0; }
  .custom-add-btn { background: rgba(78,161,242,0.15); color: var(--accent2); border: 1px solid rgba(78,161,242,0.35); border-radius: 8px; padding: 0 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .tip-item { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
  .tip-item:last-child { margin-bottom: 0; }
  .tip-item .tip-emoji { font-size: 1.3rem; flex-shrink: 0; }
  .tip-item .tip-title { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 3px; }
  .tip-item .tip-text { font-size: 0.8rem; color: var(--text); line-height: 1.45; }

  .roll-card { width: 100%; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .roll-card .name { font-weight: 700; font-size: 0.95rem; }
  .roll-card .count { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .roll-card .chevron { color: var(--muted); font-size: 1.1rem; }
  .empty-state { width: 100%; text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 20px; line-height: 1.5; }
  .detail-header { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 14px; }
  .back-btn { background: var(--panel); border: 1px solid #24252a33; color: var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
  .detail-title { font-weight: 700; font-size: 1rem; flex: 1; }
  .delete-roll-btn { color: var(--danger); font-size: 0.75rem; cursor: pointer; padding: 6px 8px; }
  .shot-card { width: 100%; background: var(--panel); border: 1px solid #24252a33; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; position: relative; display: flex; gap: 10px; }
  .shot-card .shot-photo { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .shot-card .shot-info { flex: 1; min-width: 0; }
  .shot-card .subject { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
  .shot-card .datetime { color: var(--muted); font-size: 0.72rem; margin-bottom: 6px; }
  .shot-card .params { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.78rem; color: var(--accent2); }
  .shot-card .src-tag { display: inline-block; font-size: 0.62rem; color: var(--muted); border: 1px solid #2f303680; border-radius: 6px; padding: 1px 6px; margin-top: 6px; }
  .shot-delete { position: absolute; top: 10px; right: 10px; color: var(--muted); font-size: 0.9rem; cursor: pointer; padding: 4px 8px; }
</style>
</head>
<body>

<div class="top-row">
  <div class="icon-btn" id="tipsBtn">❓</div>
  <h1 id="appTitle">📷 Sunny 16 Film</h1>
  <div class="icon-btn" id="appSettingsBtn">⚙️</div>
</div>
<div class="subtitle" id="subtitleText"></div>
<div class="camera-chip" id="cameraChip"></div>

<div class="tabs">
  <div class="tab-btn active" id="tabCalc"></div>
  <div class="tab-btn" id="tabManual"></div>
  <div class="tab-btn" id="tabDof"></div>
  <div class="tab-btn" id="tabCatalog"></div>
</div>

<!-- ===== CALCULATOR VIEW ===== -->
<div class="view" id="calcView">
  <div class="panel">
    <div class="row">
      <label>ISO</label>
      <select id="iso">
        <option value="50">50</option><option value="100" selected>100</option><option value="200">200</option>
        <option value="400">400</option><option value="800">800</option><option value="1600">1600</option>
        <option value="3200">3200</option><option value="6400">6400</option>
      </select>
    </div>
    <div style="margin-top:14px;">
      <label style="display:block;margin-bottom:8px;" id="lightCondLabel"></label>
      <div class="light-grid" id="lightGrid"></div>
    </div>
    <div class="ev-fine">
      <div class="ev-fine-label"><span id="evFineLabel"></span> <span id="evInfoBtn" style="cursor:pointer; opacity:0.7;">ⓘ</span><span>EV <span id="evLabel">15</span></span></div>
      <input type="range" id="evSlider" min="-2" max="17" step="0.5" value="15">
      <div style="text-align:center; margin-top:10px;">
        <div id="evCamBtn" style="display:inline-block; cursor:pointer; font-size:0.76rem; font-weight:700; color:var(--accent2); background:rgba(78,161,242,0.1); border:1px solid rgba(78,161,242,0.3); border-radius:999px; padding:7px 14px;"></div>
        <div style="font-size:0.65rem; color:var(--muted); margin-top:5px; line-height:1.35;" id="evCamDisclaimer"></div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:0.78rem; color:var(--muted); background:var(--bg); border-bottom:1px solid #24252a33;">
      <span>· <b id="condLabel"></b></span>
      <span>ISO <b id="isoLabel">100</b></span>
    </div>
    <table>
      <thead><tr><th id="thAperture"></th><th id="thShutter"></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="table-hint" id="tableHint"></div>
    <div class="table-hint" id="expandBtn" style="cursor:pointer; font-weight:700; color:var(--accent2);"></div>
  </div>

  <div class="reminder-badge"><span class="ricon">💡</span><span class="rtext" id="reminderText"></span></div>

  <button class="save-btn" id="saveCalcBtn"></button>
  <div class="warning" id="calcWarningText"></div>
</div>

<!-- ===== MANUAL VIEW ===== -->
<div class="view hidden" id="manualView">
  <div class="viewfinder-box" id="viewfinderBox">
    <video id="camVideo" autoplay playsinline muted class="hidden"></video>
    <img id="camPreviewImg" class="hidden">
    <div class="cam-placeholder" id="camPlaceholder">
      <div class="cam-emoji">📷</div>
      <div class="cam-activate-btn" id="camActivateBtn"></div>
    </div>
    <div class="viewfinder-controls hidden" id="viewfinderControls">
      <div class="cam-retake-btn hidden" id="camRetakeBtn">🔄</div>
      <div class="cam-shutter-btn" id="camShutterBtn"></div>
      <div style="width:42px;"></div>
    </div>
    <div id="bulbTimerDisplay" class="hidden" style="position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.65); color:#fff; padding:6px 16px; border-radius:999px; font-family:ui-monospace, monospace; font-weight:800; font-size:1rem; z-index:5;">⏱ 0.0s</div>
  </div>
  <div class="table-hint hidden" id="camExposureLabel" style="margin-top:-4px; margin-bottom:6px; font-weight:700; cursor:pointer;"></div>
  <div class="warning" id="camSimDisclaimer" style="margin-bottom:10px;"></div>

  <div class="wheel-cluster">
    <div class="wheel-col">
      <div class="wheel-label">ISO</div>
      <div class="wheel-frame"><div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div><div class="wheel-scroll" id="wheelIso"></div></div>
    </div>
    <div class="wheel-col">
      <div class="wheel-label" id="wheelLabelAp"></div>
      <div class="wheel-frame"><div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div><div class="wheel-scroll" id="wheelAp"></div></div>
    </div>
    <div class="wheel-col">
      <div class="wheel-label" id="wheelLabelSh"></div>
      <div class="wheel-frame"><div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div><div class="wheel-scroll" id="wheelSh"></div></div>
    </div>
  </div>

  <div class="mini-alert hidden" id="manualAlertBtn"></div>
  <button class="save-btn" id="saveManualBtn"></button>
  <div class="warning" id="manualWarningText"></div>
</div>

<!-- ===== DOF VIEW ===== -->
<div class="view hidden" id="dofView">
  <div class="panel">
    <div class="row"><label id="dofFocalLabel"></label><input type="number" id="dofFocal" step="1" min="8" max="1200" value="45"></div>
    <div class="row"><label id="dofApertureLabel"></label><select id="dofAperture"></select></div>

let LANG = localStorage.getItem('sunny16_lang') || 'it';
let THEME = localStorage.getItem('sunny16_theme') || 'dark';
function t(key) { return (STR[LANG] && STR[LANG][key]) || STR.it[key] || key; }
document.body.classList.toggle('theme-light', THEME === 'light');

/* ============ SCALE COMUNI (fallback quando la fotocamera non e' configurata) ============ */
const APERTURE_THIRDS = [1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32];
const SHUTTER_THIRDS = [
  1/8000,1/6400,1/5000,1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,
  1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,
  0.3,0.4,0.5,0.6,0.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30
];
/* Valori comuni proposti nel modulo di configurazione (unione scala standard + scala "continentale" Compur/Prontor) */
const COMMON_APERTURES = [1,1.2,1.4,1.8,2,2.8,3.5,4,4.5,5.6,6.3,8,9,11,13,16,18,22,32];
const COMMON_SHUTTERS = [1/8000,1/4000,1/2000,1/1000,1/750,1/500,1/300,1/250,1/200,1/125,1/100,1/60,1/50,1/30,1/25,1/15,1/10,1/8,1/5,1/4,1/2,1,2,4,8,15,30];

function formatShutter(t) {
  if (t === 'B') return 'B';
  if (t >= 1) return (Number.isInteger(t) ? t : t.toFixed(1)) + 's';
  return '1/' + Math.round(1/t);
}
function nearestIn(list, target) {
  return list.reduce((prev, curr) => Math.abs(curr - target) < Math.abs(prev - target) ? curr : prev);
}
function roundAp(v) { return Math.round(v * 10) / 10; }

/* ============ PROFILO FOTOCAMERA ============ */
const CAMERA_KEY = 'sunny16_camera_profile';
const DEFAULT_PROFILE = { apertureValues: [], shutterValues: [], hasBulb: true, focalLength: 50, configured: false };

function loadProfile() {
  try {
    let p = JSON.parse(localStorage.getItem(CAMERA_KEY));
    if (!p) return { ...DEFAULT_PROFILE };
    // migrazione da versione precedente (apMin/apMax/shFastest)
    if (p.apMin !== undefined && !p.apertureValues) {
      let apVals = APERTURE_THIRDS.filter(a => a >= p.apMin - 0.001 && a <= p.apMax + 0.001).map(roundAp);
      if (!apVals.includes(roundAp(p.apMin))) apVals.push(roundAp(p.apMin));
      if (!apVals.includes(roundAp(p.apMax))) apVals.push(roundAp(p.apMax));
      let shVals = SHUTTER_THIRDS.filter(s => s >= p.shFastest - 1e-9 && s <= 30);
      if (!shVals.includes(p.shFastest)) shVals.push(p.shFastest);
      p = { apertureValues: apVals, shutterValues: shVals, hasBulb: p.hasBulb, focalLength: p.focalLength, configured: p.configured };
    }
    return { ...DEFAULT_PROFILE, ...p };
  } catch (e) { return { ...DEFAULT_PROFILE }; }
}
function saveProfile(p) { localStorage.setItem(CAMERA_KEY, JSON.stringify(p)); }
let cameraProfile = loadProfile();

function apertureOptionsForProfile(p) {
  if (!p.configured || !p.apertureValues || !p.apertureValues.length) return APERTURE_THIRDS.slice();
  return [...p.apertureValues].sort((a,b) => a - b);
}
function numericShutterValues(p) {
  const base = (!p.configured || !p.shutterValues || !p.shutterValues.length) ? SHUTTER_THIRDS : p.shutterValues;
  return [...base].sort((a,b) => a - b);
}
function shutterOptionsForProfile(p) {
  const arr = numericShutterValues(p);
  return p.hasBulb ? [...arr, 'B'] : arr;
}
function findMatchingSavedCameraName(profile) {
  if (!profile.configured) return null;
  const cams = loadSavedCameras();
  const apSorted = [...profile.apertureValues].sort((a,b) => a-b);
  const shSorted = [...profile.shutterValues].sort((a,b) => a-b);
  for (const c of cams) {
    const cAp = [...c.apertureValues].sort((a,b) => a-b);
    const cSh = [...c.shutterValues].sort((a,b) => a-b);
    if (cAp.length === apSorted.length && cSh.length === shSorted.length &&
        cAp.every((v,i) => Math.abs(v - apSorted[i]) < 1e-9) &&
        cSh.every((v,i) => Math.abs(v - shSorted[i]) < 1e-9) &&
        c.hasBulb === profile.hasBulb && c.focalLength === profile.focalLength) {
      return c.name;
    }
  }
  return null;
}
function updateCameraChip() {
  const chip = document.getElementById('cameraChip');
  if (!cameraProfile.configured) { chip.textContent = t('cameraChipDefault'); return; }
  const sh = numericShutterValues(cameraProfile);
  const ap = apertureOptionsForProfile(cameraProfile);
  const matchName = findMatchingSavedCameraName(cameraProfile);
  const summary = `f/${ap[0]}–f/${ap[ap.length-1]} · ${formatShutter(sh[0])}–${formatShutter(sh[sh.length-1])}${cameraProfile.hasBulb ? '+B' : ''} · ${cameraProfile.focalLength}mm`;
  chip.textContent = matchName ? `📷 ${matchName} — ${summary}` : summary;
}

/* ============ NOTE POPUP ============ */

/* ============ TEMPLATE NOTE (bilingue) ============ */
function noteOverexposure(a, shutterText, minFast) {
  return LANG === 'it'
    ? `A <b>f/${a}</b> servirebbe un tempo più rapido di ${formatShutter(minFast)} (il tuo più veloce) — con ${shutterText} rischi la <b>sovraesposizione</b>. Valuta di chiudere il diaframma, abbassare l'ISO o usare un filtro ND.`
    : `At <b>f/${a}</b> you'd need a faster shutter than ${formatShutter(minFast)} (your fastest) — with ${shutterText} you risk <b>overexposure</b>. Consider closing the aperture, lowering ISO, or using an ND filter.`;
}
function noteUnderexposureNoBulb(a, idealT, maxSlow) {
  return LANG === 'it'
    ? `A <b>f/${a}</b> servirebbe un'esposizione più lunga di ${formatShutter(maxSlow)} (~${idealT.toFixed(1)}s) ma non hai la posa B — rischio di <b>sottoesposizione</b>. Valuta di aprire il diaframma o alzare l'ISO.`
    : `At <b>f/${a}</b> you'd need a longer exposure than ${formatShutter(maxSlow)} (~${idealT.toFixed(1)}s) but you don't have bulb mode — risk of <b>underexposure</b>. Consider opening the aperture or raising ISO.`;
}
function noteBulbInfo(a, idealT, maxSlow) {
  return LANG === 'it'
    ? `Il tuo tempo più lento marcato è ${formatShutter(maxSlow)}, ma a <b>f/${a}</b> servirebbe circa <b>${idealT.toFixed(1)} secondi</b>: metti la ghiera su <b>B</b> e conta i secondi a mano, sempre con il <b>cavalletto</b> — a mano libera è impossibile tenerla ferma così a lungo.`
    : `Your slowest marked speed is ${formatShutter(maxSlow)}, but at <b>f/${a}</b> you'd need about <b>${idealT.toFixed(1)} seconds</b>: set the dial to <b>B</b> and count the seconds by hand, always with a <b>tripod</b> — handheld it's impossible to hold that steady for that long.`;
}
function noteShake(shutterText, a, focalLen) {
  return LANG === 'it'
    ? `Con <b>${shutterText}</b> a f/${a} sei più lento della soglia mano libera consigliata (~1/${Math.round(focalLen)}s per un'ottica da ${focalLen}mm): meglio un <b>cavalletto</b> o un appoggio stabile per evitare il mosso.`
    : `With <b>${shutterText}</b> at f/${a} you're slower than the recommended handheld threshold (~1/${Math.round(focalLen)}s for a ${focalLen}mm lens): better use a <b>tripod</b> or stable support to avoid camera shake.`;
}
function manualNoteBulb(maxSlow) {

}
function manualNoteLong(shutterText, maxSlow) {

    : `${shutterText} is slower than your slowest marked speed (${formatShutter(maxSlow)}): use a <b>tripod</b>.`;
}
function manualNoteShake(shutterText, focalLen) {

    ? `${shutterText} è più lento della soglia mano libera (~1/${Math.round(focalLen)}s per ${focalLen}mm): meglio un <b>cavalletto</b> o un appoggio per evitare il mosso.`
    : `${shutterText} is slower than the handheld threshold (~1/${Math.round(focalLen)}s for ${focalLen}mm): better use a <b>tripod</b> or support to avoid camera shake.`;
}

/* ============ STIMA EV TRAMITE FOTOCAMERA ============ */
const evCamOverlay = document.getElementById('evCamOverlay');
const evCamVideo = document.getElementById('evCamVideo');
const evCamBtn = document.getElementById('evCamBtn');
let evCamStream = null;

async function openEvCam() {
  document.getElementById('evCamTitle').textContent = LANG === 'it' ? 'Stima EV dalla fotocamera' : 'Estimate EV from camera';
  document.getElementById('evCamHint').textContent = LANG === 'it'
    ? "Inquadra la scena e tocca \"Stima\". È una stima approssimativa basata sulla luminosità media dell'immagine — non un esposimetro calibrato: usala come punto di partenza, poi regola tu con lo slider se necessario."
    : 'Point at the scene and tap "Estimate". This is a rough estimate based on the image\'s average brightness — not a calibrated light meter: use it as a starting point, then fine-tune with the slider if needed.';
  document.getElementById('evCamEstimateBtn').textContent = LANG === 'it' ? '📸 Stima' : '📸 Estimate';
  evCamOverlay.classList.remove('hidden');
  try {
    evCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    evCamVideo.srcObject = evCamStream;
  } catch (err) {
    evCamOverlay.classList.add('hidden');
    openNotePopup(t('camPermissionError'));
  }
}
function closeEvCam() {
  if (evCamStream) { evCamStream.getTracks().forEach(tr => tr.stop()); evCamStream = null; }
  evCamOverlay.classList.add('hidden');
}
function estimateEvFromCamera() {
  if (!evCamStream || !evCamVideo.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = 48; c.height = 36;
  const ctx = c.getContext('2d');
  ctx.drawImage(evCamVideo, 0, 0, c.width, c.height);
  const data = ctx.getImageData(0, 0, c.width, c.height).data;
  let total = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
    count++;
  }
  const avgLuma = total / count; // 0-255
  const minL = 15, maxL = 235;
  const clamped = Math.max(minL, Math.min(maxL, avgLuma));
  const frac = (clamped - minL) / (maxL - minL);
  const estimatedEv = Math.round((1 + frac * 14) * 2) / 2; // arrotonda a mezzo stop, range ~1-15
  evSlider.value = estimatedEv;
  const nearest = LIGHT_CONDITIONS.reduce((prev, cnd) => Math.abs(cnd.ev - estimatedEv) < Math.abs(prev.ev - estimatedEv) ? cnd : prev);
  document.querySelectorAll('.light-btn').forEach((b, i) => {
    b.classList.toggle('active', LIGHT_CONDITIONS[i].key === nearest.key && Math.abs(nearest.ev - estimatedEv) < 0.3);
  });
  condLabel.textContent = (LANG === 'it' ? 'Stima fotocamera' : 'Camera estimate') + ` (~${condLabelOf(nearest)})`;
  renderCalc();
  closeEvCam();
}
evCamBtn.addEventListener('click', openEvCam);
document.getElementById('evCamClose').addEventListener('click', closeEvCam);
document.getElementById('evCamEstimateBtn').addEventListener('click', estimateEvFromCamera);
evCamOverlay.addEventListener('click', (e) => { if (e.target === evCamOverlay) closeEvCam(); });

evSlider.addEventListener('input', () => {
  const nearest = LIGHT_CONDITIONS.reduce((prev, c) => Math.abs(c.ev - evSlider.value) < Math.abs(prev.ev - evSlider.value) ? c : prev);
  document.querySelectorAll('.light-btn').forEach((b, i) => {
    b.classList.toggle('active', LIGHT_CONDITIONS[i].key === nearest.key && Math.abs(nearest.ev - evSlider.value) < 0.3);
  });
  condLabel.textContent = condLabelOf(nearest) + (Math.abs(nearest.ev - evSlider.value) < 0.3 ? '' : (LANG === 'it' ? ' (regolato)' : ' (adjusted)'));
  renderCalc();
});
isoSel.addEventListener('change', renderCalc);

function renderCalc() {
  const iso = parseFloat(isoSel.value);
  const ev100 = parseFloat(evSlider.value);
  evLabel.textContent = ev100;
  isoLabel.textContent = iso;
  const evIso = ev100 - Math.log2(iso / 100);

  const apOptions = apertureOptionsForProfile(cameraProfile);
  const shNumeric = numericShutterValues(cameraProfile);
  const minFast = shNumeric[0];
  const maxSlow = shNumeric[shNumeric.length - 1];
  const focalLen = cameraProfile.focalLength || 50;
  const handheldThreshold = 1 / focalLen;

  if (selectedAperture === null || !apOptions.includes(selectedAperture)) {
    selectedAperture = nearestIn(apOptions, RECOMMENDED_APERTURE_TARGET);
  }

  const idealData = apOptions.map((a, idx) => {
    const idealT = (a * a) / Math.pow(2, evIso);
    let violationStops = 0;
    if (cameraProfile.configured) {
      if (idealT < minFast - 1e-9) violationStops = Math.log2(minFast / idealT);
      else if (idealT > maxSlow && !cameraProfile.hasBulb) violationStops = Math.log2(idealT / maxSlow);
    }
    return { a, idx, idealT, violationStops };
  });
  const best = idealData.reduce((best, cur) => {
    if (cur.violationStops < best.violationStops - 1e-9) return cur;
    if (Math.abs(cur.violationStops - best.violationStops) < 1e-9 &&
        Math.abs(cur.a - RECOMMENDED_APERTURE_TARGET) < Math.abs(best.a - RECOMMENDED_APERTURE_TARGET)) return cur;
    return best;
  }, idealData[0]);
  const recommendedAperture = best.a;
  const recIdx = apOptions.indexOf(recommendedAperture);

  const allRows = apOptions.map((a, idx) => {
    const idealT = (a * a) / Math.pow(2, evIso);
    const snapped = nearestIn(shNumeric, idealT);
    const shutterText = formatShutter(snapped);
    let mark = null;
    if (cameraProfile.configured) {
      if (idealT < minFast - 1e-9) mark = { type: 'warn', text: noteOverexposure(a, shutterText, minFast) };
      else if (idealT > maxSlow && !cameraProfile.hasBulb) mark = { type: 'warn', text: noteUnderexposureNoBulb(a, idealT, maxSlow) };
      else if (idealT > maxSlow && cameraProfile.hasBulb) mark = { type: 'info', text: noteBulbInfo(a, idealT, maxSlow) };
    }
    if (!mark && a === selectedAperture && snapped > handheldThreshold && snapped <= maxSlow) {
      mark = { type: 'shake', text: noteShake(shutterText, a, focalLen) };
    }
    const distFromRec = Math.abs(idx - recIdx);
    return { aperture: a, shutterText, mark, distFromRec };
  });
  currentComputedRows = allRows;

  const visibleRows = tableExpanded ? allRows : allRows.filter(r => r.distFromRec <= 2);
  tableBody.innerHTML = '';
  visibleRows.forEach(r => {
    const { aperture: a, shutterText, mark, distFromRec } = r;
    const tr = document.createElement('tr');
    let cls = [];
    if (a === selectedAperture) cls.push('selected');
    if (distFromRec === 0) cls.push('rec-main'); else if (distFromRec === 1) cls.push('rec-near1'); else if (distFromRec === 2) cls.push('rec-near2');
    tr.className = cls.join(' ');
    const iconEmoji = mark ? (mark.type === 'warn' ? '⚠️' : mark.type === 'info' ? 'ℹ️' : '🫳') : '';
    const iconClass = mark ? (mark.type === 'warn' ? 'mk-warn' : mark.type === 'info' ? 'mk-info' : 'mk-shake') : '';
    const badge = distFromRec === 0 ? `<span class="rec-badge">${LANG === 'it' ? 'CONSIGLIATO' : 'RECOMMENDED'}</span>` : '';
    tr.innerHTML = `<td class="aperture-col">f/${a}${badge}</td><td>${shutterText}${mark ? `<span class="mark ${iconClass}" data-note>${iconEmoji}</span>` : ''}</td>`;
    tr.addEventListener('click', () => { selectedAperture = a; renderCalc(); });
    if (mark) tr.querySelector('[data-note]').addEventListener('click', (e) => { e.stopPropagation(); openNotePopup(mark.text); });
    tableBody.appendChild(tr);
  });

  const hiddenCount = allRows.length - visibleRows.length;
  if (!tableExpanded && hiddenCount > 0) {
    expandBtn.textContent = LANG === 'it' ? `Mostra tutte le combinazioni (+${hiddenCount}) ▾` : `Show all combinations (+${hiddenCount}) ▾`;
    expandBtn.classList.remove('hidden');
  } else if (tableExpanded) {
    expandBtn.textContent = LANG === 'it' ? 'Mostra meno ▴' : 'Show less ▴';
    expandBtn.classList.remove('hidden');
  } else expandBtn.classList.add('hidden');
}
expandBtn.addEventListener('click', () => { tableExpanded = !tableExpanded; renderCalc(); });

/* ============ MANUALE: ROTELLE ============ */
function createWheel(containerId, values, formatFn, initialValue, onChange) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const itemH = 40, padH = 65;
  const padTop = document.createElement('div'); padTop.style.height = padH + 'px'; container.appendChild(padTop);
  values.forEach((v, i) => {
    const item = document.createElement('div');
    item.className = 'wheel-item'; item.textContent = formatFn(v); item.dataset.idx = i;
    container.appendChild(item);
  });
  const padBottom = document.createElement('div'); padBottom.style.height = padH + 'px'; container.appendChild(padBottom);
  let currentIdx = Math.max(0, values.indexOf(initialValue));
  if (currentIdx === -1) currentIdx = 0;
  function scrollToIndex(idx, smooth) { container.scrollTo({ top: idx * itemH, behavior: smooth ? 'smooth' : 'auto' }); }
  function updateActive(idx) { container.querySelectorAll('.wheel-item').forEach((el, i) => el.classList.toggle('center-active', i === idx)); }
  scrollToIndex(currentIdx, false); updateActive(currentIdx);
  let timer;
  container.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const idx = Math.max(0, Math.min(values.length - 1, Math.round(container.scrollTop / itemH)));
      currentIdx = idx; updateActive(idx); scrollToIndex(idx, true); onChange(values[idx]);
    }, 110);
  });
  container.addEventListener('click', (e) => {
    const item = e.target.closest('.wheel-item'); if (!item) return;
    const idx = parseInt(item.dataset.idx, 10);
    currentIdx = idx; scrollToIndex(idx, true); updateActive(idx); onChange(values[idx]);
  });
  return { getValue: () => values[currentIdx] };
}

const MAN_ISO = [25, 50, 100, 200, 400, 800, 1600, 3200, 6400, 12800];
let manIsoWheel, manApWheel, manShWheel;
let manIsoVal = 100, manApVal = 8, manShVal = 1/250;
const manualAlertBtn = document.getElementById('manualAlertBtn');
let manualNoteText = null;

function renderManualNotes() {
  const focalLen = cameraProfile.focalLength || 50;
  const handheldThreshold = 1 / focalLen;
  const shNumeric = numericShutterValues(cameraProfile);
  const maxSlow = shNumeric[shNumeric.length - 1];
  const shVal = manShWheel ? manShWheel.getValue() : manShVal;
  manualNoteText = null;

  if (shVal === 'B') {
    manualNoteText = manualNoteBulb(maxSlow);
  } else if (typeof shVal === 'number') {
    if (shVal > maxSlow) manualNoteText = manualNoteLong(formatShutter(shVal), maxSlow);
    else if (shVal > handheldThreshold) manualNoteText = manualNoteShake(formatShutter(shVal), focalLen);
  }
  if (manualNoteText) { manualAlertBtn.textContent = t('manualAlertLabel'); manualAlertBtn.classList.remove('hidden'); }
  else manualAlertBtn.classList.add('hidden');
}
manualAlertBtn.addEventListener('click', () => { if (manualNoteText) openNotePopup(manualNoteText); });

function rebuildManualWheels() {
  const apOptions = apertureOptionsForProfile(cameraProfile);
  const shOptions = shutterOptionsForProfile(cameraProfile);
  if (!apOptions.includes(manApVal)) manApVal = nearestIn(apOptions, manApVal);
  if (manShVal !== 'B' && !shOptions.includes(manShVal)) {
    const numeric = shOptions.filter(v => v !== 'B');
    manShVal = numeric.length ? nearestIn(numeric, typeof manShVal === 'number' ? manShVal : 1/250) : shOptions[0];
  }
  manIsoWheel = createWheel('wheelIso', MAN_ISO, v => v, manIsoVal, v => { manIsoVal = v; renderManualNotes(); });
  manApWheel = createWheel('wheelAp', apOptions, v => 'f/' + v, manApVal, v => { manApVal = v; renderManualNotes(); });
  manShWheel = createWheel('wheelSh', shOptions, formatShutter, manShVal, v => { manShVal = v; renderManualNotes(); });
  renderManualNotes();
}

/* ============ FOTOCAMERA LIVE (scheda Manuale) ============ */
const camVideo = document.getElementById('camVideo');
const camPreviewImg = document.getElementById('camPreviewImg');
const camPlaceholder = document.getElementById('camPlaceholder');
const camActivateBtn = document.getElementById('camActivateBtn');
const viewfinderControls = document.getElementById('viewfinderControls');
const camShutterBtn = document.getElementById('camShutterBtn');
const camRetakeBtn = document.getElementById('camRetakeBtn');
const camCanvas = document.getElementById('camCanvas');
camActivateBtn.textContent = t('camActivateLabel');

let camStream = null;
let capturedPhotoDataUrl = null;

async function startCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    camVideo.srcObject = camStream;
    camVideo.classList.remove('hidden');
    camPlaceholder.classList.add('hidden');
    viewfinderControls.classList.remove('hidden');
    camPreviewImg.classList.add('hidden');
    camRetakeBtn.classList.add('hidden');
  } catch (err) {
    openNotePopup(t('camPermissionError'));
  }
}
function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(tr => tr.stop()); camStream = null; }
  camVideo.classList.add('hidden');
  viewfinderControls.classList.add('hidden');
  camPlaceholder.classList.remove('hidden');
  camPreviewImg.classList.add('hidden');
  document.getElementById('camExposureLabel').classList.add('hidden');
  cancelBulbHold();
  capturedPhotoDataUrl = null;
  lastBulbDurationSeconds = null;
}
let lastExposureExplanation = '';
let lastBulbDurationSeconds = null;
let bulbHoldStart = null;
let bulbTimerInterval = null;
const bulbTimerDisplay = document.getElementById('bulbTimerDisplay');

function cancelBulbHold() {
  if (bulbTimerInterval) { clearInterval(bulbTimerInterval); bulbTimerInterval = null; }
  bulbTimerDisplay.classList.add('hidden');
  bulbHoldStart = null;
}
function startBulbHold() {
  if (bulbHoldStart !== null) return;
  bulbHoldStart = performance.now();
  bulbTimerDisplay.textContent = '⏱ 0.0s';
  bulbTimerDisplay.classList.remove('hidden');
  bulbTimerInterval = setInterval(() => {
    const secs = (performance.now() - bulbHoldStart) / 1000;
    bulbTimerDisplay.textContent = '⏱ ' + secs.toFixed(1) + 's';
  }, 100);
}
function endBulbHold() {
  if (bulbHoldStart === null) return;
  const secs = (performance.now() - bulbHoldStart) / 1000;
  clearInterval(bulbTimerInterval); bulbTimerInterval = null;
  bulbTimerDisplay.classList.add('hidden');
  bulbHoldStart = null;
  capturePhoto(secs);
}

function capturePhoto(bulbSeconds) {
  if (!camStream) return;
  const w = camVideo.videoWidth, h = camVideo.videoHeight;
  if (!w || !h) return;
  const size = Math.min(w, h);
  const outSize = 480;
  camCanvas.width = outSize; camCanvas.height = outSize;
  const sx = (w - size) / 2, sy = (h - size) / 2;
  const ctx = camCanvas.getContext('2d');
  ctx.drawImage(camVideo, sx, sy, size, size, 0, 0, outSize, outSize);

  // --- stima la luce della scena dal fotogramma appena scattato ---
  const imgData = ctx.getImageData(0, 0, outSize, outSize);
  const data = imgData.data;
  let total = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
    count++;
  }
  const avgLuma = total / count;
  const minL = 15, maxL = 235;
  const clamped = Math.max(minL, Math.min(maxL, avgLuma));
  const frac = (clamped - minL) / (maxL - minL);
  const sceneEV100 = 1 + frac * 14;

  const iso = manIsoWheel.getValue();
  const aperture = manApWheel.getValue();
  const isBulbTimed = typeof bulbSeconds === 'number';
  const shutter = isBulbTimed ? Math.max(bulbSeconds, 1/8000) : manShWheel.getValue();
  const shutterDisplay = isBulbTimed ? `${bulbSeconds.toFixed(1)}s (B)` : formatShutter(shutter);
  lastBulbDurationSeconds = isBulbTimed ? bulbSeconds : null;
  const expLabel = document.getElementById('camExposureLabel');

  if (typeof shutter === 'number') {
    const evIso = sceneEV100 - Math.log2(iso / 100);
    const idealT = (aperture * aperture) / Math.pow(2, evIso);
    const stopsDiff = Math.log2(shutter / idealT);
    const factor = Math.pow(2, stopsDiff);
    const noiseAmount = Math.min(35, Math.max(0, (iso - 100) / 6400 * 35));
    for (let i = 0; i < data.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        let v = data[i+c] * factor;
        if (noiseAmount > 0) v += (Math.random() - 0.5) * noiseAmount;
        data[i+c] = Math.max(0, Math.min(255, v));
      }
    }
    ctx.putImageData(imgData, 0, 0);
    if (Math.abs(stopsDiff) < 0.25) {
      expLabel.textContent = '✅ ' + (LANG === 'it' ? 'Esposizione corretta' : 'Correct exposure');
    } else {
      const dir = stopsDiff > 0 ? (LANG === 'it' ? 'sovraesposta' : 'overexposed') : (LANG === 'it' ? 'sottoesposta' : 'underexposed');
      expLabel.textContent = `${stopsDiff > 0 ? '⚠️ +' : '⚠️ '}${stopsDiff.toFixed(1)} stop (${dir})`;
    }
    lastExposureExplanation = LANG === 'it'
      ? `Ho stimato la luce della scena dal fotogramma appena scattato (~EV ${sceneEV100.toFixed(1)}) e confrontato con ISO ${iso}, f/${aperture}, ${shutterDisplay} che hai impostato${isBulbTimed ? ' (tempo cronometrato tenendo premuto)' : ''}: la differenza è ${stopsDiff.toFixed(1)} stop, applicata come schiarimento/scurimento all'immagine. È una stima — la lettura di luce dalla fotocamera del telefono non è calibrata come un vero esposimetro.`
      : `I estimated the scene's light from the frame just captured (~EV ${sceneEV100.toFixed(1)}) and compared it with the ISO ${iso}, f/${aperture}, ${shutterDisplay} you set${isBulbTimed ? ' (timed by holding the shutter button)' : ''}: the difference is ${stopsDiff.toFixed(1)} stops, applied as brightening/darkening to the image. It's an estimate — the phone camera's light reading isn't calibrated like a real light meter.`;
  }
  expLabel.classList.remove('hidden');

  capturedPhotoDataUrl = camCanvas.toDataURL('image/jpeg', 0.75);
  camPreviewImg.src = capturedPhotoDataUrl;
  camPreviewImg.classList.remove('hidden');
  camVideo.classList.add('hidden');
  camRetakeBtn.classList.remove('hidden');
}
function retakePhoto() {
  capturedPhotoDataUrl = null;
  lastBulbDurationSeconds = null;

/* ============ DOF ============ */
const CIRCLE_OF_CONFUSION_MM = 0.03;
const dofFocal = document.getElementById('dofFocal');
const dofAperture = document.getElementById('dofAperture');
const dofDistance = document.getElementById('dofDistance');
const dofHyperfocal = document.getElementById('dofHyperfocal');
const dofNear = document.getElementById('dofNear');
const dofFar = document.getElementById('dofFar');
const dofSentence = document.getElementById('dofSentence');

function populateDofApertureSelect() {
  const opts = apertureOptionsForProfile(cameraProfile);
  const current = parseFloat(dofAperture.value) || 8;
  dofAperture.innerHTML = '';
  opts.forEach(a => { const opt = document.createElement('option'); opt.value = a; opt.textContent = 'f/' + a; dofAperture.appendChild(opt); });
  dofAperture.value = opts.includes(current) ? current : nearestIn(opts, 8);
}
function fmtMeters(m) {
  if (!isFinite(m)) return '∞';
  if (m >= 100) return Math.round(m) + ' m';
  if (m >= 10) return m.toFixed(1) + ' m';
  return m.toFixed(2) + ' m';
}
function renderDof() {
  const f = parseFloat(dofFocal.value) || 45;
  const N = parseFloat(dofAperture.value) || 8;
  const sMeters = parseFloat(dofDistance.value) || 3;
  const s = sMeters * 1000;
  const c = CIRCLE_OF_CONFUSION_MM;
  const H = (f * f) / (N * c) + f;
  const Dn = (H * s) / (H + (s - f));
  const Df = (s - f) >= H ? Infinity : (H * s) / (H - (s - f));
  dofHyperfocal.textContent = fmtMeters(H / 1000);
  dofNear.textContent = fmtMeters(Dn / 1000);
  dofFar.textContent = fmtMeters(Df / 1000);
  const farText = isFinite(Df) ? fmtMeters(Df/1000) : (LANG === 'it' ? 'infinito' : 'infinity');
  dofSentence.innerHTML = LANG === 'it'
    ? `A <b>f/${N}</b> e messa a fuoco a <b>${sMeters} m</b>, tutto ciò che si trova da <b>${fmtMeters(Dn/1000)}</b> a <b>${farText}</b> risulterà nitido.`
    : `At <b>f/${N}</b> focused at <b>${sMeters} m</b>, everything from <b>${fmtMeters(Dn/1000)}</b> to <b>${farText}</b> will be in focus.`;
}
[dofFocal, dofAperture, dofDistance].forEach(el => el.addEventListener('input', renderDof));

    includePhotoRow.classList.remove('hidden');
  } else {
    includePhotoRow.classList.add('hidden');
  }
  const catalog = loadCatalog();
  const rollNames = Object.keys(catalog);
  selectedRollName = rollNames.length ? rollNames[rollNames.length - 1] : null;
  rollChoiceGrid.innerHTML = '';
  rollNames.forEach(name => {
    const b = document.createElement('div');
    b.className = 'roll-choice-btn' + (name === selectedRollName ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      selectedRollName = name;
      newRollInput.classList.add('hidden'); newRollInput.value = '';
      document.querySelectorAll('.roll-choice-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
    rollChoiceGrid.appendChild(b);
  });
  const newBtn = document.createElement('div');
  newBtn.className = 'roll-choice-btn';
  newBtn.textContent = t('newRollBtn');
  newBtn.addEventListener('click', () => {
    selectedRollName = null;
    document.querySelectorAll('.roll-choice-btn').forEach(x => x.classList.remove('active'));
    newBtn.classList.add('active');
    newRollInput.classList.remove('hidden');
    newRollInput.value = `${LANG === 'it' ? 'Rullino' : 'Roll'} ${rollNames.length + 1}`;
    newRollInput.focus(); newRollInput.select();
  });
  rollChoiceGrid.appendChild(newBtn);
  if (rollNames.length === 0) { newRollInput.classList.remove('hidden'); newRollInput.value = `${LANG === 'it' ? 'Rullino' : 'Roll'} 1`; newBtn.classList.add('active'); }
  else newRollInput.classList.add('hidden');
  modalOverlay.classList.remove('hidden');
}

document.getElementById('saveCalcBtn').addEventListener('click', () => openSaveModal(buildShotDataFromCalc()));
document.getElementById('saveManualBtn').addEventListener('click', () => openSaveModal(buildShotDataFromManual()));
subjectInput.addEventListener('input', () => { if (pendingShot) stringPreview.textContent = shotToString(pendingShot, subjectInput.value); });
modalCancel.addEventListener('click', () => { modalOverlay.classList.add('hidden'); pendingShot = null; });
modalConfirm.addEventListener('click', () => {
  const rollName = (selectedRollName === null) ? (newRollInput.value.trim() || (LANG === 'it' ? 'Rullino 1' : 'Roll 1')) : selectedRollName;
  const subject = subjectInput.value.trim();
  if (!pendingShot) return;
  const includePhotoCheckbox = document.getElementById('includePhotoCheckbox');
  const finalShot = { ...pendingShot, subject };
  if (pendingShot.photo && !includePhotoCheckbox.checked) finalShot.photo = null;
  const catalog = loadCatalog();
  if (!catalog[rollName]) catalog[rollName] = [];
  catalog[rollName].push(finalShot);
  if (saveCatalogSafe(catalog)) {
    modalOverlay.classList.add('hidden');
    pendingShot = null;
    if (capturedPhotoDataUrl) retakePhoto();
  }
});

/* ============ CATALOGO ============ */
const rollListWrap = document.getElementById('rollListWrap');
const rollDetailWrap = document.getElementById('rollDetailWrap');

function showRollList() {
  openRollName = null;
  rollDetailWrap.classList.add('hidden');
  rollListWrap.classList.remove('hidden');
  rollListWrap.innerHTML = '';
  const catalog = loadCatalog();
  const names = Object.keys(catalog);
  if (names.length === 0) { rollListWrap.innerHTML = `<div class="empty-state">${t('emptyCatalog')}</div>`; return; }
  names.forEach(name => {
    const shots = catalog[name];
    const countText = LANG === 'it' ? `${shots.length} scatt${shots.length === 1 ? 'o' : 'i'}` : `${shots.length} shot${shots.length === 1 ? '' : 's'}`;
    const card = document.createElement('div');
    card.className = 'roll-card';
    card.innerHTML = `<div><div class="name">${name}</div><div class="count">${countText}</div></div><div class="chevron">›</div>`;
    card.addEventListener('click', () => showRollDetail(name));
    rollListWrap.appendChild(card);
  });
}
/* ============ RINOMINA RULLINO ============ */
const renameOverlay = document.getElementById('renameOverlay');
const renameInput = document.getElementById('renameInput');
let renamingRoll = null;

function openRenameModal(rollName) {
  renamingRoll = rollName;
  renameInput.value = rollName;
  document.getElementById('renameTitle').textContent = t('renameRollTitle');
  document.getElementById('renameCancel').textContent = t('cancelBtn');
  document.getElementById('renameConfirm').textContent = t('saveBtn');
  renameOverlay.classList.remove('hidden');
  setTimeout(() => { renameInput.focus(); renameInput.select(); }, 50);
}
document.getElementById('renameClose').addEventListener('click', () => renameOverlay.classList.add('hidden'));
document.getElementById('renameCancel').addEventListener('click', () => renameOverlay.classList.add('hidden'));
document.getElementById('renameConfirm').addEventListener('click', () => {
  const newName = renameInput.value.trim();
  if (!newName || newName === renamingRoll) { renameOverlay.classList.add('hidden'); return; }
  const catalog = loadCatalog();
  if (catalog[newName] && newName !== renamingRoll) { openNotePopup(t('duplicateRollNameError')); return; }
  const rebuilt = {};
  Object.keys(catalog).forEach(k => { rebuilt[k === renamingRoll ? newName : k] = catalog[k]; });
  if (saveCatalogSafe(rebuilt)) {
    openRollName = newName;
    renameOverlay.classList.add('hidden');
    showRollDetail(newName);
  }
});

function showRollDetail(rollName) {
  openRollName = rollName;
  rollListWrap.classList.add('hidden');
  rollDetailWrap.classList.remove('hidden');
  rollDetailWrap.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'detail-header';
  header.innerHTML = `<div class="back-btn" id="backBtn">${t('backToRolls')}</div><div class="detail-title">${rollName}</div><div class="delete-roll-btn" id="renameRollBtn" style="color:var(--accent2);">✏️</div><div class="delete-roll-btn" id="deleteRollBtn">${t('deleteRoll')}</div>`;
  rollDetailWrap.appendChild(header);
  header.querySelector('#backBtn').addEventListener('click', showRollList);
  header.querySelector('#renameRollBtn').addEventListener('click', () => openRenameModal(rollName));
  header.querySelector('#deleteRollBtn').addEventListener('click', () => {
    const catalog = loadCatalog(); delete catalog[rollName]; saveCatalogSafe(catalog); showRollList();
  });
  const catalog = loadCatalog();
  const shots = catalog[rollName] || [];
  if (shots.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = t('noShotsInRoll');
    rollDetailWrap.appendChild(empty); return;
  }
  shots.slice().reverse().forEach((shot, revIdx) => {
    const realIdx = shots.length - 1 - revIdx;
    const card = document.createElement('div');
    card.className = 'shot-card';
    const srcLine = shot.source === 'calc' ? `EV ${shot.ev} (${shot.light})` : t('manuallySet');
    const photoHtml = shot.photo ? `<img class="shot-photo" style="cursor:pointer;" src="${shot.photo}">` : '';
    card.innerHTML = `
      ${photoHtml}
      <div class="shot-info">
        <div class="shot-delete" data-idx="${realIdx}">✕</div>
        <div class="subject">${shot.subject && shot.subject.trim() ? shot.subject : t('unnamed')}</div>
        <div class="datetime">${shot.date} · ${shot.time}</div>
        <div class="params">ISO ${shot.iso} · f/${shot.aperture} · ${shot.shutter}</div>
        <div class="src-tag">${srcLine}</div>
      </div>
    `;
    if (shot.photo) {
      card.querySelector('.shot-photo').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('lightboxImg').src = shot.photo;
        document.getElementById('lightboxOverlay').classList.remove('hidden');
      });
    }
    card.querySelector('.shot-delete').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const cat = loadCatalog(); cat[rollName].splice(idx, 1); saveCatalogSafe(cat); showRollDetail(rollName);
    });
    rollDetailWrap.appendChild(card);
  });
}

/* ============ INIT ============ */
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) { modalOverlay.classList.add('hidden'); pendingShot = null; } });
[cameraModalOverlay, appSettingsOverlay, noteOverlay, tipsOverlay, renameOverlay, document.getElementById('lightboxOverlay')].forEach(ov => {
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.add('hidden'); });
});

rebuildLightGrid();
renderCalc();
rebuildManualWheels();
populateDofApertureSelect();
dofFocal.value = cameraProfile.focalLength || 45;
renderDof();
updateCameraChip();
refreshAllText();
</script>
