<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sunny 16 Film</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunny 16 Film">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #17181b;
    --accent: #f2c14e;
    --accent2: #4ea1f2;
    --text: #eaeaea;
    --muted: #8b8d93;
    --danger: #f26b4e;
  }
  body.theme-light {
    --bg: #f3f2ee;
    --panel: #ffffff;
    --text: #17181b;
    --muted: #6b6d73;
    --accent: #b8790f;
    --accent2: #1f66a8;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    padding-top: calc(env(safe-area-inset-top, 20px) + 26px);
    padding-bottom: 40px;
  }
  .top-row {
    width: 100%; max-width: 420px; display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 2px; gap: 8px;
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 4px 0 2px; color: var(--accent); text-align: center; flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel); border: 1px solid #24252a33;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; cursor: pointer;
  }
  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; text-align: center; max-width: 420px; }
  .camera-chip {
    font-size: 0.7rem; color: var(--accent2); background: rgba(78,161,242,0.1);
    border: 1px solid rgba(78,161,242,0.3); border-radius: 8px; padding: 4px 10px;
    margin-bottom: 12px; text-align: center;
  }

  .tabs {
    display: flex; width: 100%; max-width: 420px; background: var(--panel);
    border-radius: 12px; padding: 4px; margin-bottom: 16px; border: 1px solid #24252a33;
  }
  .tab-btn {
    flex: 1; text-align: center; padding: 9px 1px; font-size: 0.68rem; font-weight: 600;
    color: var(--muted); border-radius: 9px; cursor: pointer; line-height: 1.2;
  }
  .tab-btn.active { background: rgba(242,193,78,0.14); color: var(--accent); }

  .view { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }

  .panel {
    width: 100%; max-width: 420px; background: var(--panel);
    border-radius: 14px; padding: 16px; border: 1px solid #24252a33; margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  select, input[type=text], input[type=number] {
    background: var(--bg); color: var(--text); border: 1px solid #2f303680;
    border-radius: 8px; padding: 7px 10px; font-size: 0.9rem; flex: 1; margin-left: 12px;
  }
  input[type=text] { margin-left: 0; width: 100%; }
  .light-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .light-btn {
    background: var(--bg); border: 1px solid #2f303680; color: var(--text);
    padding: 8px 4px; border-radius: 10px; font-size: 0.7rem; text-align: center; cursor: pointer; line-height: 1.25;
  }
  .light-btn .emoji { font-size: 1.1rem; display: block; margin-bottom: 2px; }
  .light-btn.active { border-color: var(--accent); background: rgba(242,193,78,0.12); color: var(--accent); }
  .ev-fine { margin-top: 14px; }
  .ev-fine-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .table-wrap {
    width: 100%; max-width: 420px; background: var(--panel);
    border-radius: 14px; border: 1px solid #24252a33; overflow: hidden; margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    background: var(--bg); color: var(--muted); font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 9px 6px; text-align: center; font-weight: 600;
  }
  td { padding: 9px 6px; text-align: center; border-top: 1px solid #24252a33; }
  tbody tr { cursor: pointer; }
  tr.selected td { background: rgba(78,161,242,0.16); color: var(--accent2); font-weight: 700; }
  tr.rec-main td { background: rgba(80,200,120,0.22); color: #4fd17a; font-weight: 800; }
  tr.rec-near1 td { background: rgba(80,200,120,0.12); }
  tr.rec-near2 td { background: rgba(80,200,120,0.06); }
  tr.selected.rec-main td, tr.selected.rec-near1 td, tr.selected.rec-near2 td { background: rgba(78,161,242,0.16); color: var(--accent2); }
  .aperture-col { color: var(--accent2); font-weight: 600; }
  .rec-badge { font-size: 0.6rem; background: rgba(80,200,120,0.25); color: #4fd17a; border-radius: 5px; padding: 1px 5px; margin-left: 5px; font-weight: 700; }
  .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; margin-left: 5px;
    font-size: 0.72rem; cursor: pointer; vertical-align: middle;
  }
  .mark.mk-warn { background: rgba(242,107,78,0.16); }
  .mark.mk-info { background: rgba(78,161,242,0.16); }
  .mark.mk-shake { background: rgba(242,193,78,0.16); }
  .table-hint { text-align: center; font-size: 0.68rem; color: var(--muted); padding: 7px 10px; border-top: 1px solid #24252a33; }

  .reminder-badge {
    width: 100%; max-width: 420px; background: rgba(242,193,78,0.1);
    border: 1.5px solid rgba(242,193,78,0.45); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  .reminder-badge .ricon { font-size: 1.1rem; flex-shrink: 0; }
  .reminder-badge .rtext { font-size: 0.76rem; color: var(--text); font-weight: 600; line-height: 1.4; }

  .save-btn {
    width: 100%; max-width: 420px; background: var(--accent); color: #1a1a1a;
    border: none; padding: 13px 0; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; margin-bottom: 14px;
  }
  .save-btn:active { transform: scale(0.98); }

  .mini-alert {
    width: 100%; max-width: 420px; display: flex; align-items: center; gap: 8px;
    background: rgba(242,193,78,0.1); border: 1px solid rgba(242,193,78,0.35);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; cursor: pointer;
    font-size: 0.76rem; font-weight: 600; color: var(--text);
  }

  .warning { max-width: 420px; font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 4px; line-height: 1.4; padding: 0 8px; }

  /* Wheel pickers */
  .wheel-cluster { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 10px; }
  .wheel-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .wheel-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 8px; }
  .wheel-frame { position: relative; width: 100%; height: 190px; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px; overflow: hidden; }
  .wheel-highlight {
    position: absolute; left: 6px; right: 6px; top: 75px; height: 40px;
    background: rgba(242,193,78,0.12); border-top: 1px solid rgba(242,193,78,0.4);
    border-bottom: 1px solid rgba(242,193,78,0.4); border-radius: 8px; pointer-events: none; z-index: 2;
  }
  .wheel-fade-top, .wheel-fade-bottom { position: absolute; left: 0; right: 0; height: 50px; pointer-events: none; z-index: 3; }
  .wheel-fade-top { top: 0; background: linear-gradient(to bottom, var(--panel), transparent); }
  .wheel-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--panel), transparent); }
  .wheel-scroll { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: 40px; display: flex; align-items: center; justify-content: center;
    scroll-snap-align: center; font-size: 0.92rem; color: var(--muted);
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .wheel-item.center-active { color: var(--accent2); font-weight: 800; font-size: 1.1rem; }

  /* DOF view */
  .dof-result { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px; padding: 18px; margin-bottom: 14px; text-align: center; }
  .dof-result .hyperfocal { font-size: 0.72rem; color: var(--muted); margin-bottom: 10px; }
  .dof-result .hyperfocal b { color: var(--accent); }
  .dof-range { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
  .dof-bound { text-align: center; }
  .dof-bound .num { font-size: 1.5rem; font-weight: 800; color: var(--accent2); font-family: ui-monospace, monospace; }
  .dof-bound .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .dof-arrow { color: var(--muted); font-size: 1.2rem; }
  .dof-sentence { font-size: 0.82rem; color: var(--text); line-height: 1.5; padding-top: 10px; border-top: 1px solid #24252a33; }
  .dof-sentence b { color: var(--accent); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-card {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid #2a2b2f33;
    border-radius: 18px 18px 0 0; padding: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); max-height: 85vh; overflow-y: auto;
  }
  .modal-card h3 { margin: 0 0 12px; font-size: 1rem; color: var(--accent); }
  .modal-card .hint { font-size: 0.72rem; color: var(--muted); margin: -6px 0 14px; line-height: 1.4; }
  .string-preview {
    background: var(--bg); border: 1px solid #2f303680; border-radius: 10px; padding: 10px 12px;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 0.75rem; color: var(--accent2);
    margin-bottom: 14px; line-height: 1.5; word-break: break-word;
  }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { display: block; margin-bottom: 5px; font-size: 0.78rem; }
  .roll-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .roll-choice-btn { background: var(--bg); border: 1px solid #2f303680; color: var(--text); padding: 9px 4px; border-radius: 9px; font-size: 0.78rem; text-align: center; cursor: pointer; }
  .roll-choice-btn.active { border-color: var(--accent); background: rgba(242,193,78,0.12); color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 11px 0; border-radius: 10px; text-align: center; font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-secondary { background: rgba(128,128,128,0.15); color: var(--text); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-row label { flex: 1; margin: 0; }

  /* Catalog view */
  .roll-card {
    width: 100%; background: var(--panel); border: 1px solid #24252a33; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .roll-card .name { font-weight: 700; font-size: 0.95rem; }
  .roll-card .count { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .roll-card .chevron { color: var(--muted); font-size: 1.1rem; }
  .empty-state { width: 100%; text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 20px; line-height: 1.5; }
  .detail-header { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 14px; }
  .back-btn { background: var(--panel); border: 1px solid #24252a33; color: var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
  .detail-title { font-weight: 700; font-size: 1rem; flex: 1; }
  .delete-roll-btn { color: var(--danger); font-size: 0.75rem; cursor: pointer; padding: 6px 8px; }
  .shot-card { width: 100%; background: var(--panel); border: 1px solid #24252a33; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; position: relative; }
  .shot-card .subject { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
  .shot-card .datetime { color: var(--muted); font-size: 0.72rem; margin-bottom: 6px; }
  .shot-card .params { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.78rem; color: var(--accent2); }
  .shot-card .src-tag { display: inline-block; font-size: 0.62rem; color: var(--muted); border: 1px solid #2f303680; border-radius: 6px; padding: 1px 6px; margin-top: 6px; }
  .shot-delete { position: absolute; top: 10px; right: 10px; color: var(--muted); font-size: 0.9rem; cursor: pointer; padding: 4px 8px; }
</style>
</head>
<body>

<div class="top-row">
  <div class="icon-btn" style="visibility:hidden;">⚙️</div>
  <h1 id="appTitle">📷 Sunny 16 Film</h1>
  <div class="icon-btn" id="appSettingsBtn">⚙️</div>
</div>
<div class="subtitle" id="subtitleText"></div>
<div class="camera-chip" id="cameraChip" style="cursor:pointer;"></div>

<div class="tabs">
  <div class="tab-btn active" id="tabCalc"></div>
  <div class="tab-btn" id="tabManual"></div>
  <div class="tab-btn" id="tabDof"></div>
  <div class="tab-btn" id="tabCatalog"></div>
</div>

<!-- ===== CALCULATOR VIEW ===== -->
<div class="view" id="calcView">
  <div class="panel">
    <div class="row">
      <label>ISO</label>
      <select id="iso">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="400">400</option>
        <option value="800">800</option>
        <option value="1600">1600</option>
        <option value="3200">3200</option>
        <option value="6400">6400</option>
      </select>
    </div>
    <div style="margin-top:14px;">
      <label style="display:block;margin-bottom:8px;" id="lightCondLabel"></label>
      <div class="light-grid" id="lightGrid"></div>
    </div>
    <div class="ev-fine">
      <div class="ev-fine-label"><span id="evFineLabel"></span><span>EV <span id="evLabel">15</span></span></div>
      <input type="range" id="evSlider" min="-2" max="17" step="0.5" value="15">
    </div>
  </div>

  <div class="table-wrap">
    <div class="header-info" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:0.78rem; color:var(--muted); background:var(--bg); border-bottom:1px solid #24252a33;">
      <span id="condLabelWrap">· <b id="condLabel"></b></span>
      <span>ISO <b id="isoLabel">100</b></span>
    </div>
    <table>
      <thead><tr><th id="thAperture"></th><th id="thShutter"></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="table-hint" id="tableHint"></div>
    <div class="table-hint" id="expandBtn" style="cursor:pointer; font-weight:700; color:var(--accent2);"></div>
  </div>

  <div class="reminder-badge">
    <span class="ricon">💡</span>
    <span class="rtext" id="reminderText"></span>
  </div>

  <button class="save-btn" id="saveCalcBtn"></button>

  <div class="warning" id="calcWarningText"></div>
</div>

<!-- ===== MANUAL VIEW ===== -->
<div class="view hidden" id="manualView">
  <div class="wheel-cluster">
    <div class="wheel-col">
      <div class="wheel-label">ISO</div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div>
        <div class="wheel-scroll" id="wheelIso"></div>
      </div>
    </div>
    <div class="wheel-col">
      <div class="wheel-label" id="wheelLabelAp"></div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div>
        <div class="wheel-scroll" id="wheelAp"></div>
      </div>
    </div>
    <div class="wheel-col">
      <div class="wheel-label" id="wheelLabelSh"></div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div><div class="wheel-fade-top"></div><div class="wheel-fade-bottom"></div>
        <div class="wheel-scroll" id="wheelSh"></div>
      </div>
    </div>
  </div>

  <div class="mini-alert hidden" id="manualAlertBtn"></div>

  <button class="save-btn" id="saveManualBtn"></button>

  <div class="warning" id="manualWarningText"></div>
</div>

<!-- ===== DOF VIEW ===== -->
<div class="view hidden" id="dofView">
  <div class="panel">
    <div class="row"><label id="dofFocalLabel"></label><input type="number" id="dofFocal" step="1" min="8" max="1200" value="45"></div>
    <div class="row"><label id="dofApertureLabel"></label><select id="dofAperture"></select></div>
    <div class="row"><label id="dofDistanceLabel"></label><input type="number" id="dofDistance" step="0.1" min="0.2" max="1000" value="3"></div>
  </div>

  <div class="dof-result">
    <div class="hyperfocal"><span id="dofHyperfocalPrefix"></span> <b id="dofHyperfocal">--</b></div>
    <div class="dof-range">
      <div class="dof-bound"><div class="num" id="dofNear">--</div><div class="lbl" id="dofNearLabel"></div></div>
      <div class="dof-arrow">→</div>
      <div class="dof-bound"><div class="num" id="dofFar">--</div><div class="lbl" id="dofFarLabel"></div></div>
    </div>
    <div class="dof-sentence" id="dofSentence">--</div>
  </div>

  <div class="warning" id="dofWarningText"></div>
</div>

<!-- ===== CATALOG VIEW ===== -->
<div class="view hidden" id="catalogView">
  <div id="rollListWrap" style="width:100%;"></div>
  <div id="rollDetailWrap" style="width:100%;" class="hidden"></div>
</div>

<!-- ===== SAVE SHOT MODAL ===== -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card">
    <h3 id="saveShotTitle"></h3>
    <div class="string-preview" id="stringPreview"></div>
    <div class="modal-field">
      <label id="rollFieldLabel"></label>
      <div class="roll-choice-grid" id="rollChoiceGrid"></div>
      <input type="text" id="newRollInput" class="hidden">
    </div>
    <div class="modal-field">
      <label id="subjectFieldLabel"></label>
      <input type="text" id="subjectInput">
    </div>
    <div class="modal-actions">
      <div class="btn btn-secondary" id="modalCancel"></div>
      <div class="btn btn-primary" id="modalConfirm"></div>
    </div>
  </div>
</div>

<!-- ===== CAMERA SETTINGS MODAL ===== -->
<div class="modal-overlay hidden" id="cameraModalOverlay">
  <div class="modal-card">
    <h3 id="cameraModalTitle"></h3>
    <div class="hint" id="cameraModalHint"></div>
    <div class="modal-field"><label id="apMinLabel"></label><input type="number" id="apMinInput" step="0.1" min="0.7" max="64" value="1.4"></div>
    <div class="modal-field"><label id="apMaxLabel"></label><input type="number" id="apMaxInput" step="0.1" min="0.7" max="64" value="22"></div>
    <div class="modal-field"><label id="shFastestLabel"></label><select id="shFastestSelect"></select></div>
    <div class="checkbox-row"><input type="checkbox" id="hasBulbCheckbox" checked><label id="bulbLabel"></label></div>
    <div class="modal-field" style="margin-top:12px;"><label id="focalLabel"></label><input type="number" id="focalLengthInput" step="1" min="8" max="1200" value="50"></div>
    <div class="hint" id="focalHint" style="margin-top:-4px;"></div>
    <div class="modal-actions">
      <div class="btn btn-secondary" id="cameraModalReset"></div>
      <div class="btn btn-primary" id="cameraModalSave"></div>
    </div>
  </div>
</div>

<!-- ===== APP SETTINGS MODAL ===== -->
<div class="modal-overlay hidden" id="appSettingsOverlay">
  <div class="modal-card">
    <h3 id="appSettingsTitle"></h3>
    <div class="modal-field">
      <label id="langFieldLabel"></label>
      <div class="roll-choice-grid" id="langChoiceGrid"></div>
    </div>
    <div class="modal-field">
      <label id="themeFieldLabel"></label>
      <div class="roll-choice-grid" id="themeChoiceGrid"></div>
    </div>
    <div class="modal-actions">
      <div class="btn btn-primary" id="appSettingsClose" style="flex:1;"></div>
    </div>
  </div>
</div>

<!-- ===== NOTE POPUP ===== -->
<div class="modal-overlay hidden" id="noteOverlay">
  <div class="modal-card">
    <div class="string-preview" id="noteText" style="color:var(--text); font-family:inherit; font-size:0.88rem;"></div>
    <div class="modal-actions"><div class="btn btn-primary" id="noteOk" style="flex:1;">OK</div></div>
  </div>
</div>

<script>
/* ============================ I18N ============================ */

/* ============ SCALE A TERZI DI STOP ============ */
const APERTURE_THIRDS = [1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32];
const SHUTTER_THIRDS = [
  1/8000,1/6400,1/5000,1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,
  1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,
  0.3,0.4,0.5,0.6,0.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30
];
function formatShutter(t) {
  if (t === 'B') return 'B';
  if (t >= 1) return (Number.isInteger(t) ? t : t.toFixed(1)) + 's';
  return '1/' + Math.round(1/t);
}
function nearestIn(list, target) {
  return list.reduce((prev, curr) => Math.abs(curr - target) < Math.abs(prev - target) ? curr : prev);
}

/* ============ PROFILO FOTOCAMERA ============ */
const CAMERA_KEY = 'sunny16_camera_profile';
const DEFAULT_PROFILE = { apMin: 1.4, apMax: 22, shFastest: 1/8000, hasBulb: true, focalLength: 50, configured: false };
function loadProfile() {
  try { const p = JSON.parse(localStorage.getItem(CAMERA_KEY)); return p ? { ...DEFAULT_PROFILE, ...p } : { ...DEFAULT_PROFILE }; }
  catch (e) { return { ...DEFAULT_PROFILE }; }
}
function saveProfile(p) { localStorage.setItem(CAMERA_KEY, JSON.stringify(p)); }
let cameraProfile = loadProfile();

function apertureOptionsForProfile(p) {
  const base = APERTURE_THIRDS.filter(a => a >= p.apMin - 0.001 && a <= p.apMax + 0.001);
  const set = new Set(base.map(v => Math.round(v*10)/10));
  set.add(Math.round(p.apMin*10)/10);
  set.add(Math.round(p.apMax*10)/10);
  return Array.from(set).sort((a,b) => a-b);
}
function shutterOptionsForProfile(p) {
  const base = SHUTTER_THIRDS.filter(t => t >= p.shFastest - 1e-9);
  const set = new Set(base);
  set.add(p.shFastest);
  let arr = Array.from(set).sort((a,b) => a-b);
  if (p.hasBulb) arr.push('B');
  return arr;
}
function updateCameraChip() {
  const chip = document.getElementById('cameraChip');
  chip.textContent = !cameraProfile.configured
    ? t('cameraChipDefault')
    : `📷 f/${cameraProfile.apMin}–f/${cameraProfile.apMax} · max ${formatShutter(cameraProfile.shFastest)}${cameraProfile.hasBulb ? ' · B' : ''} · ${cameraProfile.focalLength}mm`;
}

/* ============ TEMPLATE NOTE (bilingue) ============ */
function noteOverexposure(a, shutterText) {
  return LANG === 'it'
    ? `A <b>f/${a}</b> servirebbe un tempo più rapido di ${formatShutter(cameraProfile.shFastest)} (il tuo massimo) — con ${shutterText} rischi la <b>sovraesposizione</b>. Valuta di chiudere il diaframma, abbassare l'ISO o usare un filtro ND.`
    : `At <b>f/${a}</b> you'd need a faster shutter than ${formatShutter(cameraProfile.shFastest)} (your max) — with ${shutterText} you risk <b>overexposure</b>. Consider closing the aperture, lowering ISO, or using an ND filter.`;
}
function noteUnderexposureNoBulb(a, idealT) {
  return LANG === 'it'
    ? `A <b>f/${a}</b> servirebbe un'esposizione molto lunga (~${idealT.toFixed(0)}s) ma non hai la posa B — rischio di <b>sottoesposizione</b>. Valuta di aprire il diaframma o alzare l'ISO.`
    : `At <b>f/${a}</b> you'd need a very long exposure (~${idealT.toFixed(0)}s) but you don't have bulb mode — risk of <b>underexposure</b>. Consider opening the aperture or raising ISO.`;
}
function noteBulbInfo(a, idealT) {
  return LANG === 'it'
    ? `A <b>f/${a}</b> servirebbe circa <b>${idealT.toFixed(0)} secondi</b>: tieni aperto l'otturatore in posa B contando i secondi, e usa <b>sempre il cavalletto</b> — a mano è impossibile tenerla ferma così a lungo.`
    : `At <b>f/${a}</b> you'd need about <b>${idealT.toFixed(0)} seconds</b>: hold the shutter open in bulb mode counting the seconds, and <b>always use a tripod</b> — handheld it's impossible to hold that steady for that long.`;
}
function noteShake(shutterText, a, focalLen) {
  return LANG === 'it'
    ? `Con <b>${shutterText}</b> a f/${a} sei più lento della soglia mano libera consigliata (~1/${Math.round(focalLen)}s per un'ottica da ${focalLen}mm): meglio un <b>cavalletto</b> o un appoggio stabile per evitare il mosso.`
    : `With <b>${shutterText}</b> at f/${a} you're slower than the recommended handheld threshold (~1/${Math.round(focalLen)}s for a ${focalLen}mm lens): better use a <b>tripod</b> or stable support to avoid camera shake.`;
}
function manualNoteBulb() {
  return LANG === 'it'
    ? `Posa B selezionata: tieni aperto l'otturatore per il tempo che decidi tu, sempre con <b>cavalletto</b> — a mano è impraticabile.`
    : `Bulb mode selected: hold the shutter open for as long as you decide, always with a <b>tripod</b> — handheld it's impractical.`;
}
function manualNoteLong(shutterText) {
  return LANG === 'it'
    ? `${shutterText} è un'esposizione molto lunga: usa il <b>cavalletto</b>.`
    : `${shutterText} is a very long exposure: use a <b>tripod</b>.`;
}
function manualNoteShake(shutterText, focalLen) {
  return LANG === 'it'
    ? `${shutterText} è più lento della soglia mano libera (~1/${Math.round(focalLen)}s per ${focalLen}mm): meglio un <b>cavalletto</b> o un appoggio per evitare il mosso.`
    : `${shutterText} is slower than the handheld threshold (~1/${Math.round(focalLen)}s for ${focalLen}mm): better use a <b>tripod</b> or support to avoid camera shake.`;
}

function condLabelOf(cond) { return cond[LANG]; }

let selectedAperture = null;
let currentComputedRows = [];
let currentCondition = LIGHT_CONDITIONS[1];
let tableExpanded = false;
const RECOMMENDED_APERTURE_TARGET = 8; // punto di partenza per il "consigliato"

const isoSel = document.getElementById('iso');
const lightGrid = document.getElementById('lightGrid');
const evSlider = document.getElementById('evSlider');
const evLabel = document.getElementById('evLabel');
const condLabel = document.getElementById('condLabel');
const isoLabel = document.getElementById('isoLabel');
const tableBody = document.getElementById('tableBody');

function rebuildLightGrid() {
  lightGrid.innerHTML = '';
  LIGHT_CONDITIONS.forEach((cond) => {
    const btn = document.createElement('div');
    btn.className = 'light-btn' + (cond.key === currentCondition.key ? ' active' : '');
    btn.innerHTML = `<span class="emoji">${cond.emoji}</span>${condLabelOf(cond)}`;
    btn.addEventListener('click', () => {
      currentCondition = cond;
      evSlider.value = cond.ev;
      document.querySelectorAll('.light-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      condLabel.textContent = condLabelOf(cond);
      renderCalc();
    });
    lightGrid.appendChild(btn);
  });
  condLabel.textContent = condLabelOf(currentCondition);
}

evSlider.addEventListener('input', () => {
  const nearest = LIGHT_CONDITIONS.reduce((prev, c) =>
    Math.abs(c.ev - evSlider.value) < Math.abs(prev.ev - evSlider.value) ? c : prev
  );
  document.querySelectorAll('.light-btn').forEach((b, i) => {
    b.classList.toggle('active', LIGHT_CONDITIONS[i].key === nearest.key && Math.abs(nearest.ev - evSlider.value) < 0.3);
  });
  condLabel.textContent = condLabelOf(nearest) + (Math.abs(nearest.ev - evSlider.value) < 0.3 ? '' : (LANG === 'it' ? ' (regolato)' : ' (adjusted)'));
  renderCalc();
});
isoSel.addEventListener('change', renderCalc);

const expandBtn = document.getElementById('expandBtn');

function renderCalc() {
  const iso = parseFloat(isoSel.value);
  const ev100 = parseFloat(evSlider.value);
  evLabel.textContent = ev100;
  isoLabel.textContent = iso;
  const evIso = ev100 - Math.log2(iso / 100);

  const apOptions = apertureOptionsForProfile(cameraProfile);
  const shPool = shutterOptionsForProfile(cameraProfile).filter(v => v !== 'B');
  const focalLen = cameraProfile.focalLength || 50;
  const handheldThreshold = 1 / focalLen;

  if (selectedAperture === null || !apOptions.includes(selectedAperture)) {
    selectedAperture = nearestIn(apOptions, RECOMMENDED_APERTURE_TARGET);
  }
  const recommendedAperture = nearestIn(apOptions, RECOMMENDED_APERTURE_TARGET);
  const recIdx = apOptions.indexOf(recommendedAperture);

  // calcola tutte le righe (dati), poi decide quali mostrare
  const allRows = apOptions.map((a, idx) => {
    const idealT = (a * a) / Math.pow(2, evIso);
    const snapped = nearestIn(shPool, Math.max(1/8000, Math.min(60, idealT)));
    const shutterText = formatShutter(snapped);
    let mark = null;

    if (cameraProfile.configured) {
      if (idealT < cameraProfile.shFastest - 1e-9) {
        mark = { type: 'warn', text: noteOverexposure(a, shutterText) };
      } else if (idealT > 30 && !cameraProfile.hasBulb) {
        mark = { type: 'warn', text: noteUnderexposureNoBulb(a, idealT) };
      } else if (idealT > 30 && cameraProfile.hasBulb) {
        mark = { type: 'info', text: noteBulbInfo(a, idealT) };
      }
    }
    if (!mark && a === selectedAperture && snapped > handheldThreshold && snapped <= 30) {
      mark = { type: 'shake', text: noteShake(shutterText, a, focalLen) };
    }
    const distFromRec = Math.abs(idx - recIdx);
    return { aperture: a, shutterText, mark, distFromRec, idx };
  });
  currentComputedRows = allRows;

  const visibleRows = tableExpanded ? allRows : allRows.filter(r => r.distFromRec <= 2);

  tableBody.innerHTML = '';
  visibleRows.forEach(r => {
    const { aperture: a, shutterText, mark, distFromRec } = r;
    const tr = document.createElement('tr');
    let cls = [];
    if (a === selectedAperture) cls.push('selected');
    if (distFromRec === 0) cls.push('rec-main');
    else if (distFromRec === 1) cls.push('rec-near1');
    else if (distFromRec === 2) cls.push('rec-near2');
    tr.className = cls.join(' ');

    const iconEmoji = mark ? (mark.type === 'warn' ? '⚠️' : mark.type === 'info' ? 'ℹ️' : '🫳') : '';
    const iconClass = mark ? (mark.type === 'warn' ? 'mk-warn' : mark.type === 'info' ? 'mk-info' : 'mk-shake') : '';
    const badge = distFromRec === 0 ? `<span class="rec-badge">${LANG === 'it' ? 'CONSIGLIATO' : 'RECOMMENDED'}</span>` : '';
    tr.innerHTML = `<td class="aperture-col">f/${a}${badge}</td><td>${shutterText}${mark ? `<span class="mark ${iconClass}" data-note>${iconEmoji}</span>` : ''}</td>`;
    tr.addEventListener('click', () => { selectedAperture = a; renderCalc(); });
    if (mark) {
      tr.querySelector('[data-note]').addEventListener('click', (e) => { e.stopPropagation(); openNotePopup(mark.text); });
    }
    tableBody.appendChild(tr);
  });

  const hiddenCount = allRows.length - visibleRows.length;
  if (!tableExpanded && hiddenCount > 0) {
    expandBtn.textContent = (LANG === 'it' ? `Mostra tutte le combinazioni (+${hiddenCount}) ▾` : `Show all combinations (+${hiddenCount}) ▾`);
    expandBtn.classList.remove('hidden');
  } else if (tableExpanded) {
    expandBtn.textContent = (LANG === 'it' ? 'Mostra meno ▴' : 'Show less ▴');
    expandBtn.classList.remove('hidden');
  } else {
    expandBtn.classList.add('hidden');
  }
}
expandBtn.addEventListener('click', () => { tableExpanded = !tableExpanded; renderCalc(); });

/* ============ MANUALE: ROTELLE ============ */
function createWheel(containerId, values, formatFn, initialValue, onChange) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const itemH = 40, padH = 75;
  const padTop = document.createElement('div'); padTop.style.height = padH + 'px'; container.appendChild(padTop);
  values.forEach((v, i) => {
    const item = document.createElement('div');
    item.className = 'wheel-item';
    item.textContent = formatFn(v);
    item.dataset.idx = i;
    container.appendChild(item);
  });
  const padBottom = document.createElement('div'); padBottom.style.height = padH + 'px'; container.appendChild(padBottom);

  let currentIdx = Math.max(0, values.indexOf(initialValue));
  if (currentIdx === -1) currentIdx = 0;
  function scrollToIndex(idx, smooth) { container.scrollTo({ top: idx * itemH, behavior: smooth ? 'smooth' : 'auto' }); }
  function updateActive(idx) { container.querySelectorAll('.wheel-item').forEach((el, i) => el.classList.toggle('center-active', i === idx)); }
  scrollToIndex(currentIdx, false);
  updateActive(currentIdx);

  let timer;
  container.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const idx = Math.max(0, Math.min(values.length - 1, Math.round(container.scrollTop / itemH)));
      currentIdx = idx;
      updateActive(idx);
      scrollToIndex(idx, true);
      onChange(values[idx]);
    }, 110);
  });
  container.addEventListener('click', (e) => {
    const item = e.target.closest('.wheel-item');
    if (!item) return;
    const idx = parseInt(item.dataset.idx, 10);
    currentIdx = idx;
    scrollToIndex(idx, true);
    updateActive(idx);
    onChange(values[idx]);
  });
  return { getValue: () => values[currentIdx] };
}

const MAN_ISO = [25, 50, 100, 200, 400, 800, 1600, 3200, 6400, 12800];
let manIsoWheel, manApWheel, manShWheel;
let manIsoVal = 100, manApVal = 8, manShVal = 1/250;
const manualAlertBtn = document.getElementById('manualAlertBtn');
let manualNoteText = null;

function renderManualNotes() {
  const focalLen = cameraProfile.focalLength || 50;
  const handheldThreshold = 1 / focalLen;
  const shVal = manShWheel ? manShWheel.getValue() : manShVal;
  manualNoteText = null;

  if (shVal === 'B') {
    manualNoteText = manualNoteBulb();
  } else if (typeof shVal === 'number') {
    if (shVal > 30) manualNoteText = manualNoteLong(formatShutter(shVal));
    else if (shVal > handheldThreshold) manualNoteText = manualNoteShake(formatShutter(shVal), focalLen);
  }

  if (manualNoteText) {
    manualAlertBtn.textContent = t('manualAlertLabel');
    manualAlertBtn.classList.remove('hidden');
  } else {
    manualAlertBtn.classList.add('hidden');
  }
}
manualAlertBtn.addEventListener('click', () => { if (manualNoteText) openNotePopup(manualNoteText); });

function rebuildManualWheels() {
  const apOptions = apertureOptionsForProfile(cameraProfile);
  const shOptions = shutterOptionsForProfile(cameraProfile);
  if (!apOptions.includes(manApVal)) manApVal = nearestIn(apOptions, manApVal);
  if (manShVal !== 'B' && !shOptions.includes(manShVal)) {
    const numeric = shOptions.filter(v => v !== 'B');
    manShVal = numeric.length ? nearestIn(numeric, typeof manShVal === 'number' ? manShVal : 1/250) : shOptions[0];
  }
  manIsoWheel = createWheel('wheelIso', MAN_ISO, v => v, manIsoVal, v => { manIsoVal = v; renderManualNotes(); });
  manApWheel = createWheel('wheelAp', apOptions, v => 'f/' + v, manApVal, v => { manApVal = v; renderManualNotes(); });
  manShWheel = createWheel('wheelSh', shOptions, formatShutter, manShVal, v => { manShVal = v; renderManualNotes(); });
  renderManualNotes();
}

/* ============ DOF ============ */
const CIRCLE_OF_CONFUSION_MM = 0.03;
const dofFocal = document.getElementById('dofFocal');
const dofAperture = document.getElementById('dofAperture');
const dofDistance = document.getElementById('dofDistance');
const dofHyperfocal = document.getElementById('dofHyperfocal');
const dofNear = document.getElementById('dofNear');
const dofFar = document.getElementById('dofFar');
const dofSentence = document.getElementById('dofSentence');

function populateDofApertureSelect() {
  const opts = apertureOptionsForProfile(cameraProfile);
  const current = parseFloat(dofAperture.value) || 8;
  dofAperture.innerHTML = '';
  opts.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = 'f/' + a;
    dofAperture.appendChild(opt);
  });
  dofAperture.value = opts.includes(current) ? current : nearestIn(opts, 8);
}
function fmtMeters(m) {
  if (!isFinite(m)) return '∞';
  if (m >= 100) return Math.round(m) + ' m';
  if (m >= 10) return m.toFixed(1) + ' m';
  return m.toFixed(2) + ' m';
}
function renderDof() {
  const f = parseFloat(dofFocal.value) || 45;
  const N = parseFloat(dofAperture.value) || 8;
  const sMeters = parseFloat(dofDistance.value) || 3;
  const s = sMeters * 1000;
  const c = CIRCLE_OF_CONFUSION_MM;
  const H = (f * f) / (N * c) + f;
  const Dn = (H * s) / (H + (s - f));
  const Df = (s - f) >= H ? Infinity : (H * s) / (H - (s - f));

  dofHyperfocal.textContent = fmtMeters(H / 1000);
  dofNear.textContent = fmtMeters(Dn / 1000);
  dofFar.textContent = fmtMeters(Df / 1000);
  const farText = isFinite(Df) ? fmtMeters(Df/1000) : (LANG === 'it' ? 'infinito' : 'infinity');
  dofSentence.innerHTML = LANG === 'it'
    ? `A <b>f/${N}</b> e messa a fuoco a <b>${sMeters} m</b>, tutto ciò che si trova da <b>${fmtMeters(Dn/1000)}</b> a <b>${farText}</b> risulterà nitido.`
    : `At <b>f/${N}</b> focused at <b>${sMeters} m</b>, everything from <b>${fmtMeters(Dn/1000)}</b> to <b>${farText}</b> will be in focus.`;
}
[dofFocal, dofAperture, dofDistance].forEach(el => el.addEventListener('input', renderDof));

const tabManual = document.getElementById('tabManual');

const manualView = document.getElementById('manualView');
const dofView = document.getElementById('dofView');

let openRollName = null;

function setActiveTab(tab) {
  [tabCalc, tabManual, tabDof, tabCatalog].forEach(el => el.classList.remove('active'));
  [calcView, manualView, dofView, catalogView].forEach(v => v.classList.add('hidden'));
  if (tab === 'calc') { tabCalc.classList.add('active'); calcView.classList.remove('hidden'); }
  if (tab === 'manual') { tabManual.classList.add('active'); manualView.classList.remove('hidden'); }
  if (tab === 'dof') { tabDof.classList.add('active'); dofView.classList.remove('hidden'); }
  if (tab === 'catalog') {
    tabCatalog.classList.add('active'); catalogView.classList.remove('hidden');
    openRollName ? showRollDetail(openRollName) : showRollList();
  }
}
tabCalc.addEventListener('click', () => setActiveTab('calc'));
tabManual.addEventListener('click', () => setActiveTab('manual'));
tabDof.addEventListener('click', () => setActiveTab('dof'));
tabCatalog.addEventListener('click', () => setActiveTab('catalog'));

/* ============ CAMERA SETTINGS MODAL ============ */

const apMaxInput = document.getElementById('apMaxInput');
const shFastestSelect = document.getElementById('shFastestSelect');

const focalLengthInput = document.getElementById('focalLengthInput');

function rebuildShFastestSelect() {
  shFastestSelect.innerHTML = '';
  SHUTTER_THIRDS.forEach(tVal => {
    const opt = document.createElement('option');
    opt.value = tVal; opt.textContent = formatShutter(tVal);
    shFastestSelect.appendChild(opt);
  });
}

function openCameraModal() {
  apMinInput.value = cameraProfile.apMin;
  apMaxInput.value = cameraProfile.apMax;
  shFastestSelect.value = cameraProfile.shFastest;
  hasBulbCheckbox.checked = cameraProfile.hasBulb;
  focalLengthInput.value = cameraProfile.focalLength;
  cameraModalOverlay.classList.remove('hidden');
}
cameraChipEl.addEventListener('click', openCameraModal);

function applyProfileEverywhere() {
  updateCameraChip();
  selectedAperture = null;
  renderCalc();
  rebuildManualWheels();
  populateDofApertureSelect();
  dofFocal.value = cameraProfile.focalLength;
  renderDof();
}
document.getElementById('cameraModalSave').addEventListener('click', () => {
  const apMin = parseFloat(apMinInput.value) || DEFAULT_PROFILE.apMin;
  const apMax = parseFloat(apMaxInput.value) || DEFAULT_PROFILE.apMax;
  cameraProfile = {
    apMin: Math.min(apMin, apMax), apMax: Math.max(apMin, apMax),
    shFastest: parseFloat(shFastestSelect.value), hasBulb: hasBulbCheckbox.checked,
    focalLength: parseFloat(focalLengthInput.value) || DEFAULT_PROFILE.focalLength, configured: true,
  };
  saveProfile(cameraProfile);
  applyProfileEverywhere();
  cameraModalOverlay.classList.add('hidden');
});
document.getElementById('cameraModalReset').addEventListener('click', () => {
  cameraProfile = { ...DEFAULT_PROFILE };
  saveProfile(cameraProfile);
  applyProfileEverywhere();
  cameraModalOverlay.classList.add('hidden');
});

/* ============ STORAGE CATALOGO ============ */
const STORAGE_KEY = 'sunny16_catalog_v1';
function loadCatalog() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; } }
function saveCatalog(catalog) { localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog)); }

/* ============ SAVE SHOT MODAL ============ */
const modalOverlay = document.getElementById('modalOverlay');
const stringPreview = document.getElementById('stringPreview');
const subjectInput = document.getElementById('subjectInput');
const rollChoiceGrid = document.getElementById('rollChoiceGrid');
const newRollInput = document.getElementById('newRollInput');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');

function pad(n) { return n.toString().padStart(2, '0'); }
function buildShotDataFromCalc() {
  const now = new Date();
  const iso = parseFloat(isoSel.value);
  const row = currentComputedRows.find(r => r.aperture === selectedAperture);
  const ev100 = parseFloat(evSlider.value);
  return {
    date: `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`,
    time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    iso, aperture: selectedAperture, shutter: row ? row.shutterText : '--',
    ev: ev100, light: condLabelOf(currentCondition), source: 'calc',
  };
}
function buildShotDataFromManual() {
  const now = new Date();
  return {
    date: `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`,
    time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    iso: manIsoWheel.getValue(), aperture: manApWheel.getValue(),
    shutter: formatShutter(manShWheel.getValue()), source: 'manual',
  };
}
function shotToString(shot, subject) {
  const subj = subject && subject.trim() ? subject.trim() : t('unnamed');
  const base = `${shot.date} ${shot.time} — ${subj} — ISO ${shot.iso}, f/${shot.aperture}, ${shot.shutter}`;
  return shot.source === 'calc' ? `${base}, EV ${shot.ev} (${shot.light})` : `${base} (${t('manuallySet')})`;
}

let pendingShot = null;
let selectedRollName = null;

function openSaveModal(shot) {
  pendingShot = shot;
  subjectInput.value = '';
  stringPreview.textContent = shotToString(pendingShot, '');

  const catalog = loadCatalog();
  const rollNames = Object.keys(catalog);
  selectedRollName = rollNames.length ? rollNames[rollNames.length - 1] : null;

  rollChoiceGrid.innerHTML = '';
  rollNames.forEach(name => {
    const b = document.createElement('div');
    b.className = 'roll-choice-btn' + (name === selectedRollName ? ' active' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      selectedRollName = name;
      newRollInput.classList.add('hidden');
      newRollInput.value = '';
      document.querySelectorAll('.roll-choice-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
    rollChoiceGrid.appendChild(b);
  });

  const newBtn = document.createElement('div');
  newBtn.className = 'roll-choice-btn';
  newBtn.textContent = t('newRollBtn');
  newBtn.addEventListener('click', () => {
    selectedRollName = null;
    document.querySelectorAll('.roll-choice-btn').forEach(x => x.classList.remove('active'));
    newBtn.classList.add('active');
    newRollInput.classList.remove('hidden');
    newRollInput.value = `${LANG === 'it' ? 'Rullino' : 'Roll'} ${rollNames.length + 1}`;
    newRollInput.focus();
    newRollInput.select();
  });
  rollChoiceGrid.appendChild(newBtn);

  if (rollNames.length === 0) {
    newRollInput.classList.remove('hidden');
    newRollInput.value = `${LANG === 'it' ? 'Rullino' : 'Roll'} 1`;
    newBtn.classList.add('active');
  } else {
    newRollInput.classList.add('hidden');
  }
  modalOverlay.classList.remove('hidden');
}

document.getElementById('saveCalcBtn').addEventListener('click', () => openSaveModal(buildShotDataFromCalc()));
document.getElementById('saveManualBtn').addEventListener('click', () => openSaveModal(buildShotDataFromManual()));
subjectInput.addEventListener('input', () => { if (pendingShot) stringPreview.textContent = shotToString(pendingShot, subjectInput.value); });
modalCancel.addEventListener('click', () => { modalOverlay.classList.add('hidden'); pendingShot = null; });
modalConfirm.addEventListener('click', () => {
  const rollName = (selectedRollName === null) ? (newRollInput.value.trim() || (LANG === 'it' ? 'Rullino 1' : 'Roll 1')) : selectedRollName;
  const subject = subjectInput.value.trim();
  if (!pendingShot) return;
  const catalog = loadCatalog();
  if (!catalog[rollName]) catalog[rollName] = [];
  catalog[rollName].push({ ...pendingShot, subject });
  saveCatalog(catalog);
  modalOverlay.classList.add('hidden');
  pendingShot = null;
});

/* ============ CATALOGO ============ */
const rollListWrap = document.getElementById('rollListWrap');
const rollDetailWrap = document.getElementById('rollDetailWrap');

function showRollList() {
  openRollName = null;
  rollDetailWrap.classList.add('hidden');
  rollListWrap.classList.remove('hidden');
  rollListWrap.innerHTML = '';
  const catalog = loadCatalog();
  const names = Object.keys(catalog);
  if (names.length === 0) {
    rollListWrap.innerHTML = `<div class="empty-state">${t('emptyCatalog')}</div>`;
    return;
  }
  names.forEach(name => {
    const shots = catalog[name];
    const countText = LANG === 'it'
      ? `${shots.length} scatt${shots.length === 1 ? 'o' : 'i'}`
      : `${shots.length} shot${shots.length === 1 ? '' : 's'}`;
    const card = document.createElement('div');
    card.className = 'roll-card';
    card.innerHTML = `<div><div class="name">${name}</div><div class="count">${countText}</div></div><div class="chevron">›</div>`;
    card.addEventListener('click', () => showRollDetail(name));
    rollListWrap.appendChild(card);
  });
}

function showRollDetail(rollName) {
  openRollName = rollName;
  rollListWrap.classList.add('hidden');
  rollDetailWrap.classList.remove('hidden');
  rollDetailWrap.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'detail-header';
  header.innerHTML = `<div class="back-btn" id="backBtn">${t('backToRolls')}</div><div class="detail-title">${rollName}</div><div class="delete-roll-btn" id="deleteRollBtn">${t('deleteRoll')}</div>`;
  rollDetailWrap.appendChild(header);
  header.querySelector('#backBtn').addEventListener('click', showRollList);
  header.querySelector('#deleteRollBtn').addEventListener('click', () => {
    const catalog = loadCatalog();
    delete catalog[rollName];
    saveCatalog(catalog);
    showRollList();
  });

  const catalog = loadCatalog();
  const shots = catalog[rollName] || [];
  if (shots.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = t('noShotsInRoll');
    rollDetailWrap.appendChild(empty);
    return;
  }
  shots.slice().reverse().forEach((shot, revIdx) => {
    const realIdx = shots.length - 1 - revIdx;
    const card = document.createElement('div');
    card.className = 'shot-card';
    const srcLine = shot.source === 'calc' ? `EV ${shot.ev} (${shot.light})` : t('manuallySet');
    card.innerHTML = `
      <div class="shot-delete" data-idx="${realIdx}">✕</div>
      <div class="subject">${shot.subject && shot.subject.trim() ? shot.subject : t('unnamed')}</div>
      <div class="datetime">${shot.date} · ${shot.time}</div>
      <div class="params">ISO ${shot.iso} · f/${shot.aperture} · ${shot.shutter}</div>
      <div class="src-tag">${srcLine}</div>
    `;
    card.querySelector('.shot-delete').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const cat = loadCatalog();
      cat[rollName].splice(idx, 1);
      saveCatalog(cat);
      showRollDetail(rollName);
    });
    rollDetailWrap.appendChild(card);
  });
}

/* ============ INIT ============ */
rebuildShFastestSelect();
rebuildLightGrid();
renderCalc();
rebuildManualWheels();
populateDofApertureSelect();
dofFocal.value = cameraProfile.focalLength || 45;
renderDof();
updateCameraChip();
refreshAllText();
</script>
